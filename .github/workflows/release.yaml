name: Release app

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    name: Verify version
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1

      - name: Match tag to app version
        run: |
          version=$(sed -n 's/^version: "\(.*\)"/\1/p' iterate_home_assistant/config.yaml)
          test "${GITHUB_REF_NAME}" = "v${version}"

  image:
    name: Publish app image
    needs: verify
    if: github.repository == 'iterate/home-assistant'
    permissions:
      contents: read
      id-token: write
      packages: write
    uses: ./.github/workflows/build-app.yaml
    with:
      publish: true
    secrets: inherit
